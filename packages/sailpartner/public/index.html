<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sailpartner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg id="screen" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Sailpartner"></svg>

<div id="picker" class="overlay" hidden>
  <div class="sheet">
    <h2>Pick a harbour</h2>
    <div id="dest-list" class="dest-list"></div>
    <div class="actions">
      <button id="cancel" class="secondary">Cancel</button>
    </div>
    <p id="picker-error" class="error" hidden></p>
  </div>
</div>

<div id="note" class="overlay" hidden>
  <div class="sheet">
    <h2>Add a logbook entry</h2>
    <input id="note-text" type="text" maxlength="200" placeholder="Passed Fehmarnsund bridge" autocomplete="off">
    <div class="actions">
      <button id="note-cancel" class="secondary">Cancel</button>
      <button id="note-save" class="primary">Save</button>
    </div>
    <p id="note-error" class="error" hidden></p>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
